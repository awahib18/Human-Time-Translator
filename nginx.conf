# Nginx configuration for Human Time Translator
# Save to: /etc/nginx/sites-available/timehuman
# Link to: /etc/nginx/sites-enabled/timehuman

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # REPLACE WITH YOUR DOMAIN

    # For auto-ssl with certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com; # REPLACE WITH YOUR DOMAIN

    # SSL Certs (Managed by Certbot, populated after running `sudo certbot --nginx`)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root /var/www/timehuman/dist;
    index index.html;

    # Gzip Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml font/woff2 application/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:;";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Handle SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML (never cache)
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets heavily
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
